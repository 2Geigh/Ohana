name: "Ohana"

networks:
        # for creating & maintianing
        # the searchable web database
        infrastructure:

        # for handling the reception and
        # evaluation of, and response to,
        # user search queries
        userspace:

services:
        db:
                networks:
                        - infrastructure
                        - userspace
                build:
                        context: ./services/db
                        dockerfile: ./dockerfile
                container_name: ohana-db
                environment:
                        PGUSER: ${DB_USERNAME}
                        POSTGRES_PASSWORD: ${DB_PASSWORD}
                        POSTGRES_DB: ${DB_NAME}
                        POSTGRES_PORT: ${DB_CONTAINER_PORT}
                volumes:
                        - db-data:/var/lib/ohana
                healthcheck:
                        test: ["CMD", "pg_isready"]
                        interval: 1s
                        timeout: 5s
                        retries: 100

        db-init:
                networks:
                        - infrastructure
                build:
                        context: ./services
                        dockerfile: ./db-init/build/dockerfile
                container_name: ohana-db-initializer
                depends_on:
                        db:
                                condition: service_healthy
                env_file:
                        - ./.env

        db-janitor:
                networks:
                        - infrastructure
                build:
                        context: ./services
                        dockerfile: ./db-janitor/build/dockerfile
                container_name: ohana-db-janitor
                depends_on:
                        db-init:
                                condition: service_completed_successfully
                env_file:
                        - ./.env

        crawler:
                networks:
                        - infrastructure
                build:
                        context: ./services
                        dockerfile: ./crawler/build/dockerfile
                container_name: ohana-crawler
                depends_on:
                        db-init:
                                condition: service_completed_successfully
                env_file:
                        - ./.env

        client:
                container_name: ohana-client
                networks:
                        - userspace
                build:
                        context: ./services/client
                        dockerfile: ./dockerfile
                volumes:
                        - ./services/client/public:/var/www/html/public
                healthcheck:
                        test: ["CMD-SHELL", "php-fpm -t"]
                        interval: 5s
                        timeout: 3s
                        retries: 10

        server:
                container_name: ohana-server
                image: nginx:stable-alpine-slim
                networks:
                        - userspace
                depends_on:
                        client:
                                condition: service_healthy
                volumes:
                        - ./services/client/public:/var/www/html/public:ro
                        - ./services/server/nginx.conf:/etc/nginx/nginx.conf:ro
                ports:
                        - "3020:80"

volumes:
        db-data:
        index-data:
