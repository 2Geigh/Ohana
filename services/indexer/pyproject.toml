[project]
name = "indexer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nick Garcia", email = "nicholasgarcia2003@protonmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.31.0",
    "bs4>=0.0.2",
    "lxml>=6.1.3",
    "pip>=26.2.1",
    "polyglot>=16.7.4",
    "pycld2>=0.42",
    "pyicu>=2.16.2",
    "sentence-transformers>=6.1.0",
    "setuptools>=84.0.0",
    "six>=1.17.0",
    "spacy>=3.8.16",
    "torch",
    "wheel>=0.48.0",
]

[project.scripts]
indexer = "indexer:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" }
]


[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
